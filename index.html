<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#fff9f3" />
<title>Pupwell — Water Demo</title>
<style>
:root{--ink:#26233f;--muted:#65627d;--cream:#fff9f3;--card:#f8e9d8;--blue:#4ca9e8;--teal:#4d9eab;--dark:#3d3240;--soft:#eef2f2;--msg:#eff7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#fffaf5,#fff6ee);font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh}
.app{width:min(100%,430px);min-height:100vh;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.header{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin:5px 0 14px}.back{font-size:35px;color:#352936}.headercopy{text-align:center}.title{font-size:31px;font-weight:850;letter-spacing:-1px}.subtitle{font-size:14px;color:var(--muted);margin-top:2px}
.scene{height:335px;border-radius:30px;overflow:hidden;background:linear-gradient(155deg,#fff3de 0%,#f8e9d8 52%,#f3dfcb 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(92,69,55,.13)}
.sun{position:absolute;width:210px;height:210px;border-radius:50%;background:rgba(255,246,217,.92);right:-68px;top:-70px}.plant{position:absolute;left:18px;bottom:18px;font-size:42px;opacity:.45}.rug{position:absolute;width:250px;height:62px;border-radius:50%;background:rgba(213,159,118,.17);bottom:18px}
.milo{width:230px;height:210px;z-index:2;transform-origin:50% 85%;transition:.25s ease}.milo.wiggle{animation:wiggle .6s ease}.milo.sip{animation:sip .72s ease}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) translateY(-4px)}50%{transform:rotate(3deg) translateY(-7px)}75%{transform:rotate(-2deg) translateY(-3px)}}@keyframes sip{0%,100%{transform:translateY(0)}45%{transform:translateY(18px) rotate(1deg)}}
.state{z-index:2;margin-top:-14px;font-size:14px;font-weight:700;color:#5d5060;text-align:center}.bowl{z-index:2;width:112px;height:50px;border-radius:20px;background:var(--teal);border:3px solid #3f8994;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;margin-top:11px;box-shadow:0 8px 20px rgba(64,113,121,.18)}.bowlwater{position:absolute;left:0;right:0;bottom:0;background:#8dd5e6;opacity:.8;transition:height .35s ease}.bowllabel{position:relative;color:#fff;font-size:13px;font-weight:900;letter-spacing:1.5px}
.stats{padding:20px 4px 0;text-align:center}.amount{font-size:23px;font-weight:650}.amount strong{font-size:32px;font-weight:900}.track{height:13px;border-radius:999px;background:#e7e5e4;margin-top:12px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:999px;transition:width .35s ease}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.btn{border:0;cursor:pointer;font:inherit}.quick button{background:var(--soft);padding:15px 8px;border-radius:18px;font-weight:850;color:#343449;font-size:15px}.quick button:active,.custom:active{transform:scale(.98)}.custom{width:100%;background:var(--dark);color:#fff;border-radius:20px;padding:17px;margin-top:14px;font-size:16px;font-weight:850}
.message{display:flex;align-items:center;background:var(--msg);padding:14px;border-radius:19px;margin-top:14px;min-height:68px}.drop{font-size:25px;margin-right:10px}.msgcopy{color:#4d526d;font-weight:650;line-height:1.35}.manual{display:none;background:#fff;border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 10px 30px rgba(60,44,39,.1)}.manual.open{display:flex;gap:10px}.manual input{min-width:0;flex:1;border:1px solid #ded8d5;border-radius:14px;padding:12px;font-size:16px}.manual button{border:0;border-radius:14px;padding:0 16px;background:#5f9f6d;color:white;font-weight:800}.reset{display:block;margin:16px auto 0;border:0;background:transparent;text-decoration:underline;color:#8a7b88;padding:8px;font:inherit;font-size:13px}
.note{text-align:center;color:#8b7d88;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<main class="app">
  <header class="header"><div class="back">‹</div><div class="headercopy"><div class="title">Water</div><div class="subtitle">A hydrated you means a happy pup!</div></div><div></div></header>
  <section class="scene">
    <div class="sun"></div><div class="plant">🌿</div><div class="rug"></div>
    <svg id="milo" class="milo" viewBox="0 0 200 180" aria-label="Cute cartoon dog Milo">
      <ellipse cx="100" cy="146" rx="67" ry="17" fill="#EBD9C6" opacity=".55"/>
      <ellipse cx="100" cy="112" rx="55" ry="50" fill="#F0B66A"/>
      <ellipse cx="55" cy="91" rx="24" ry="42" fill="#D78A43" transform="rotate(18 55 91)"/>
      <ellipse cx="145" cy="91" rx="24" ry="42" fill="#D78A43" transform="rotate(-18 145 91)"/>
      <ellipse cx="100" cy="93" rx="46" ry="43" fill="#F6C982"/>
      <ellipse cx="100" cy="112" rx="30" ry="24" fill="#FFF1DC"/>
      <circle cx="83" cy="88" r="6" fill="#3E2F37"/><circle cx="117" cy="88" r="6" fill="#3E2F37"/>
      <circle cx="81" cy="86" r="2" fill="#fff"/><circle cx="115" cy="86" r="2" fill="#fff"/>
      <ellipse cx="100" cy="105" rx="9" ry="7" fill="#3E2F37"/>
      <path id="mouth" d="M 84 92 Q 100 98 116 92" stroke="#3E2F37" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M72 129 Q100 143 128 129 L122 153 Q100 163 78 153 Z" fill="#4FA69A"/><circle cx="100" cy="144" r="6" fill="#F4C056"/>
    </svg>
    <div id="state" class="state">Milo could use a little drink.</div>
    <div class="bowl"><div id="bowlwater" class="bowlwater"></div><div class="bowllabel">MILO</div></div>
  </section>
  <section class="stats"><div class="amount"><strong id="water">24</strong> / 64 oz</div><div class="track"><div id="fill" class="fill"></div></div></section>
  <div class="quick"><button class="btn" data-add="8">+8 oz</button><button class="btn" data-add="16">+16 oz</button><button class="btn" data-add="24">+24 oz</button></div>
  <button id="custom" class="btn custom">Log custom amount</button>
  <div id="manual" class="manual"><input id="manualInput" inputmode="decimal" type="number" min="1" max="64" placeholder="oz"/><button id="saveManual">Add</button></div>
  <div class="message"><div class="drop">💧</div><div id="message" class="msgcopy">A hydrated you means a happy pup.</div></div>
  <button id="reset" class="reset">Reset demo</button><div class="note">Prototype only — Apple Health sync comes later.</div>
</main>
<script>
const GOAL=64; let water=Number(localStorage.getItem('pupwell-water')||24);
const $=id=>document.getElementById(id); const milo=$('milo');
function mood(){const r=Math.min(water/GOAL,1); if(r>=.75)return ['happy','M 78 86 Q 100 104 122 86','Milo is feeling great!']; if(r>=.35)return ['okay','M 84 92 Q 100 98 116 92','Milo could use a little drink.']; return ['thirsty','M 86 98 Q 100 88 114 98','Milo is checking his water bowl…'];}
function render(){const pct=Math.min(water/GOAL,1); $('water').textContent=water; $('fill').style.width=(pct*100)+'%'; $('bowlwater').style.height=Math.max(10,pct*100)+'%'; const [s,path,text]=mood(); $('mouth').setAttribute('d',path); $('state').textContent=text; localStorage.setItem('pupwell-water',water);}
function animate(kind){milo.classList.remove('wiggle','sip'); void milo.offsetWidth; milo.classList.add(kind); setTimeout(()=>milo.classList.remove(kind),800)}
function add(amount){water=Math.min(120,water+amount); if(water>=GOAL){$('message').textContent='Goal reached! Milo does a happy little victory wiggle.';animate('wiggle')} else if(amount>=24){$('message').textContent='Big drink! Milo trots over and takes a long sip.';animate('sip')} else {$('message').textContent='Milo hears the bowl filling and comes running.';animate('sip')} render();}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>add(Number(b.dataset.add))));
$('custom').addEventListener('click',()=>{$('manual').classList.toggle('open');$('manualInput').focus()});
$('saveManual').addEventListener('click',()=>{const v=Number($('manualInput').value);if(v>0){add(v);$('manualInput').value='';$('manual').classList.remove('open')}});
$('reset').addEventListener('click',()=>{water=24;$('message').textContent='A hydrated you means a happy pup.';render()});render();
</script>
</body>
</html>
